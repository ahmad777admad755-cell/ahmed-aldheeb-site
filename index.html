<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080a12">
  <meta name="description" content="الموقع الشخصي لأحمد الذيب — تواصل مباشر عبر واتساب.">
  <title>أحمد الذيب | الموقع الشخصي</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap');
    :root{color-scheme:dark;--gold:#e7bd72;--ink:#080a12}
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 35%,#20283b 0%,#0d1220 42%,#070910 100%);color:#f7f4ed;font-family:'Cairo',Tahoma,sans-serif;overflow-x:hidden}
    .intro{position:fixed;inset:0;z-index:5;display:grid;place-items:center;padding:24px;background:linear-gradient(145deg,#080a12,#141a29 55%,#080a12);transition:opacity 1.1s ease,visibility 1.1s ease}
    .intro.hide{opacity:0;visibility:hidden;pointer-events:none}
    .scene{width:min(850px,94vw);text-align:center;perspective:1000px;animation:arrive 1.2s ease both}
    .scene-label{font-size:12px;letter-spacing:5px;color:#b6bdca;margin-bottom:25px}
    .computer{position:relative;width:min(660px,88vw);margin:auto;transform:rotateX(3deg);filter:drop-shadow(0 35px 35px #0009)}
    .screen{aspect-ratio:16/9;border:10px solid #303744;border-bottom-width:16px;border-radius:18px;background:radial-gradient(ellipse at 50% 40%,#26334a,#090d17 72%);display:grid;place-items:center;position:relative;overflow:hidden;box-shadow:inset 0 0 35px #000,0 0 0 1px #8b98a955}
    .screen:before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 25%,#ffffff0b 48%,transparent 67%);transform:translateX(-100%);animation:shine 3s 1s infinite}
    .screen:after{content:"";position:absolute;inset:12px;border:1px solid #d8b56c30;border-radius:5px}
    .screen-name{font-size:clamp(32px,8vw,76px);font-weight:900;letter-spacing:1px;color:#f4d89d;text-shadow:0 0 12px #e6b95b99,0 0 35px #d49a3b88;position:relative;z-index:1}
    .screen-sub{font-size:clamp(9px,2vw,13px);letter-spacing:4px;color:#aeb9cb;margin-top:8px}
    .chin{height:23px;background:linear-gradient(#3a4351,#171d29);width:100%;border-radius:0 0 8px 8px}
    .stand{width:18%;height:48px;margin:auto;background:linear-gradient(90deg,#171d29,#596170,#171d29);clip-path:polygon(28% 0,72% 0,85% 82%,100% 100%,0 100%,15% 82%)}
    .base{width:31%;height:10px;margin:auto;border-radius:50%;background:linear-gradient(#687181,#202633);box-shadow:0 9px 18px #0008}
    .intro-caption{margin:25px 0 0;color:#b9c0ce;font-size:14px;letter-spacing:1px}
    .skip{margin-top:23px;border:1px solid #ffffff35;background:#ffffff0b;color:#eee;padding:9px 19px;border-radius:30px;font:inherit;font-size:12px;cursor:pointer}
    main{min-height:100vh;display:grid;place-items:center;padding:48px 20px}
    .profile{width:min(720px,100%);text-align:center;padding:clamp(28px,7vw,58px);border:1px solid #ffffff18;border-radius:28px;background:linear-gradient(145deg,#ffffff0c,#ffffff04);box-shadow:0 30px 90px #0006;backdrop-filter:blur(12px);animation:rise 1s .3s both}
    .mark{width:76px;height:76px;margin:0 auto 24px;border-radius:24px;display:grid;place-items:center;border:1px solid #e7bd7266;background:linear-gradient(145deg,#4a3924,#171923);color:var(--gold);font-size:30px;box-shadow:inset 0 1px 0 #fff3,0 12px 30px #0006}
    h1{font-size:clamp(34px,7vw,58px);margin:0;color:#f2d59b;font-weight:900;text-shadow:0 5px 25px #d9a94c30}
    .lead{color:#c4c9d3;font-size:clamp(14px,2.7vw,18px);line-height:2;margin:12px auto 28px;max-width:490px}
    .rule{width:70px;height:2px;margin:0 auto 27px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
    .contact{display:inline-flex;align-items:center;justify-content:center;gap:12px;padding:15px 30px;min-width:220px;border-radius:14px;border:1px solid #f6d99b;background:linear-gradient(180deg,#f2d49a,#b88642);color:#17120a;text-decoration:none;font-weight:900;font-size:17px;box-shadow:0 7px 0 #765126,0 14px 28px #0007,inset 0 2px 0 #fff9;transition:transform .18s,box-shadow .18s}
    .contact:hover{transform:translateY(-3px);box-shadow:0 10px 0 #765126,0 20px 35px #0008,inset 0 2px 0 #fff9}
    .contact:active{transform:translateY(4px);box-shadow:0 3px 0 #765126,0 8px 18px #0007}
    .wa{width:23px;height:23px;fill:currentColor}
    footer{margin-top:36px;color:#7f899b;font-size:12px}
    @keyframes arrive{from{opacity:0;transform:translateY(24px) rotateX(5deg)}to{opacity:1;transform:translateY(0) rotateX(0)}}
    @keyframes shine{to{transform:translateX(100%)}}
    @keyframes rise{from{opacity:0;transform:translateY(25px)}to{opacity:1;transform:translateY(0)}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <section class="intro" id="intro" aria-label="مقدمة الموقع">
    <div class="scene">
      <div class="scene-label">WELCOME TO MY WORLD</div>
      <div class="computer">
        <div class="screen">
          <div>
            <div class="screen-name">أحمد الذيب</div>
            <div class="screen-sub">PERSONAL WEBSITE</div>
          </div>
        </div>
        <div class="chin"></div><div class="stand"></div><div class="base"></div>
      </div>
      <p class="intro-caption">حضور رقمي… بطابع مختلف</p>
      <button class="skip" id="skip" type="button">تخطي المقدمة</button>
    </div>
  </section>
  <main>
    <section class="profile">
      <div class="mark" aria-hidden="true">ذ</div>
      <h1>أحمد الذيب</h1>
      <p class="lead">مرحبًا بك في موقعي الشخصي. يسعدني تواصلك معي مباشرة عبر واتساب.</p>
      <div class="rule"></div>
      <a class="contact" href="https://wa.me/967739310394" target="_blank" rel="noopener noreferrer">
        <svg class="wa" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.52 3.48A11.82 11.82 0 0 0 12.1 0C5.56 0 .24 5.32.24 11.86c0 2.09.55 4.13 1.59 5.93L.14 24l6.36-1.67a11.9 11.9 0 0 0 5.6 1.42h.01c6.54 0 11.86-5.32 11.86-11.86 0-3.17-1.23-6.15-3.45-8.41ZM12.1 21.73a9.88 9.88 0 0 1-5.03-1.37l-.36-.21-3.77.99 1.01-3.67-.24-.38a9.83 9.83 0 0 1-1.51-5.23c0-5.46 4.44-9.9 9.91-9.9a9.83 9.83 0 0 1 7.01 2.91 9.83 9.83 0 0 1 2.9 7.02c0 5.46-4.44 9.9-9.91 9.9Zm5.43-7.41c-.3-.15-1.77-.87-2.05-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.94 1.17-.17.2-.35.22-.65.07-.3-.15-1.26-.46-2.4-1.47-.89-.79-1.49-1.77-1.66-2.07-.17-.3-.02-.46.13-.61.13-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.07-.15-.67-1.62-.92-2.22-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.79.37-.27.3-1.04 1.02-1.04 2.49s1.07 2.89 1.22 3.09c.15.2 2.1 3.2 5.08 4.49.71.31 1.27.5 1.7.64.71.23 1.36.2 1.87.12.57-.09 1.77-.72 2.02-1.42.25-.7.25-1.3.17-1.42-.07-.12-.27-.2-.57-.35Z"/></svg>
        تواصل عبر واتساب
      </a>
      <footer>© <span id="year"></span> أحمد الذيب — جميع الحقوق محفوظة</footer>
    </section>
  </main>
  <script>
    const intro = document.getElementById('intro');
    const closeIntro = () => intro.classList.add('hide');
    document.getElementById('skip').addEventListener('click', closeIntro);
    window.setTimeout(closeIntro, 4200);
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
